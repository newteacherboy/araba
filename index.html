<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taşıma Planı 🚗</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --text:#1c2230; --muted:#697086; --line:#e4e8ef;
  --accent:#2f6fed; --accent2:#ff8a3d; --hero1:#2f6fed; --hero2:#7b3ff2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12151c; --card:#1b1f2a; --text:#eef1f6; --muted:#9aa3b8; --line:#2a3040; }
}
:root[data-theme="dark"]{ --bg:#12151c; --card:#1b1f2a; --text:#eef1f6; --muted:#9aa3b8; --line:#2a3040; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:20px 14px 40px;}
.wrap{max-width:640px;margin:0 auto;}
h1{font-size:1.4rem;margin:0 0 2px;}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:18px;}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px;color:#fff;
  background:linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:0 8px 24px rgba(47,111,237,.25);
  animation:pop .5s ease;min-height:70px;}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.hero .tag{font-size:.75rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em;}
.hero .day{font-size:1.5rem;font-weight:700;margin:4px 0 10px;}
.hero .who{display:flex;align-items:center;gap:10px;font-size:1.1rem;font-weight:600;}
.hero .avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:1.2rem;animation:wheel 3s linear infinite;}
@keyframes wheel{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-8deg);}}
.hero .note{margin-top:8px;font-size:.85rem;opacity:.9;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
.pcard b{display:block;font-size:1.3rem;}
.pcard .lbl{font-size:.72rem;color:var(--muted);margin-top:2px;}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s ease;}
.section-title{font-size:.95rem;font-weight:700;margin:22px 0 8px;}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.88rem;}
.row:last-child{border-bottom:none;}
.row.past{opacity:.5;}
.row.today{background:rgba(47,111,237,.08);font-weight:600;}
.row.holiday{color:var(--muted);font-style:italic;}
.badge{padding:3px 9px;border-radius:20px;font-size:.78rem;font-weight:600;background:var(--accent);color:#fff;}
.scroll{max-height:340px;overflow-y:auto;}
.toggle{display:block;width:100%;text-align:center;padding:10px;font-size:.85rem;color:var(--accent);background:none;border:none;cursor:pointer;}
.admin{margin-top:26px;padding:16px;border-radius:14px;border:1px dashed var(--line);background:var(--card);}
.admin h3{margin:0 0 10px;font-size:.9rem;}
.admin label{display:block;font-size:.78rem;color:var(--muted);margin:8px 0 3px;}
.admin input,.admin select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.85rem;}
.admin .row2{display:flex;gap:8px;}
.admin .row2 > *{flex:1;}
.admin button{margin-top:10px;padding:9px 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;}
.admin .mini{background:var(--accent2);}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:.75rem;margin:3px 4px 0 0;}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0;}
.status{font-size:.78rem;color:var(--muted);margin-top:8px;min-height:16px;}
details summary{cursor:pointer;font-size:.8rem;color:var(--muted);margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🚗 Ortak Araç Planı</h1>
  <div class="sub" id="subtitle">Yükleniyor…</div>
  <div class="hero" id="hero"></div>
  <div class="cards" id="cards"></div>
  <div class="section-title">Program</div>
  <div class="list" id="scrollWrap">
    <div class="scroll" id="timeline"></div>
    <button class="toggle" id="toggleBtn">Tüm planı göster</button>
  </div>

  <details>
    <summary>🛠️ Yönetici girişi (tatil ekle / gün ata)</summary>
    <div class="admin">
      <label>PIN</label>
      <input type="password" id="pinInput" placeholder="Ayarlar sekmesindeki PIN">
      <label>Tatil / okula gidilmeyen gün ekle</label>
      <div class="row2"><input type="date" id="holDate"><button id="holBtn">Tatil Ekle</button></div>
      <div id="holChips"></div>
      <label>Belirli bir gün için manuel sürücü ata</label>
      <div class="row2">
        <input type="date" id="ovDate">
        <select id="ovPerson"></select>
      </div>
      <button class="mini" id="ovBtn">Ata</button>
      <div id="ovChips"></div>
      <div class="status" id="statusMsg"></div>
    </div>
  </details>
</div>

<script>
// ==== BURAYI DOLDUR: Apps Script'i deploy ettikten sonra aldığın Web App URL'i buraya yapıştır ====
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbznntc2iQMn8gAmqsUA9F-7QTw2fk3gbfzK-A8vhvjtnsnpVnfwgZaoCtJEQqJXv6dy/exec";

const WD = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const ICON = {};
let cfg = null, expanded = false;

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function todayISO(){return iso(new Date());}
function isTomorrow(dISO){ const t=new Date(); t.setDate(t.getDate()+1); return iso(t)===dISO; }

function buildSchedule(c){
  const start=parseISO(c.startDate), end=parseISO(c.endDate);
  const usage={}, lastSeen={}; c.people.forEach(p=>{usage[p]=0; lastSeen[p]=-1;});
  const sched=[]; let idx=0;
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const dISO=iso(d), wd=d.getDay();
    if(wd===0||wd===6) continue;
    if(c.holidays.includes(dISO)){ sched.push({date:dISO,wd,holiday:true}); continue; }
    const required = c.people.filter(p=>(c.rules[p]||[]).includes(wd));
    if(required.length===0){ sched.push({date:dISO,wd,holiday:true}); continue; }
    let driver;
    if(c.overrides[dISO]) driver = c.overrides[dISO];
    else if(required.length===1) driver = required[0];
    else driver = required.slice().sort((a,b)=> usage[a]!==usage[b] ? usage[a]-usage[b] : lastSeen[a]-lastSeen[b])[0];
    usage[driver]++; lastSeen[driver]=idx++;
    sched.push({date:dISO,wd,holiday:false,required,driver});
  }
  return {sched, usage};
}

function render(){
  if(!cfg) return;
  const {sched, usage} = buildSchedule(cfg);
  const tISO = todayISO();
  document.getElementById('subtitle').textContent = 'Dönem: '+cfg.startDate+' → '+cfg.endDate;

  const soFar={}; cfg.people.forEach(p=>soFar[p]=0);
  sched.forEach(s=>{ if(!s.holiday && s.date<=tISO) soFar[s.driver]++; });
  const maxTotal = Math.max(...cfg.people.map(p=>usage[p]||0),1);
  document.getElementById('cards').innerHTML = cfg.people.map(p=>
    `<div class="pcard"><b>${soFar[p]||0}</b><div class="lbl">${p}<br>(dönem sonu: ${usage[p]||0})</div>
     <div class="bar"><i style="width:${((usage[p]||0)/maxTotal*100).toFixed(0)}%"></i></div></div>`).join('');

  let heroEntry = sched.find(s=>s.date>=tISO && !s.holiday);
  const heroBox = document.getElementById('hero');
  if(heroEntry){
    const label = heroEntry.date===tISO ? 'BUGÜN' : (isTomorrow(heroEntry.date)?'YARIN':heroEntry.date);
    heroBox.innerHTML = `<div class="tag">${label}</div>
      <div class="day">${WD[heroEntry.wd]} · ${heroEntry.date}</div>
      <div class="who"><span class="avatar">🚗</span> ${heroEntry.driver}'nın arabasıyla gidiyoruz</div>
      <div class="note">Gidenler: ${heroEntry.required.join(', ')}</div>`;
  } else {
    heroBox.innerHTML = `<div class="tag">Plan tamam</div><div class="day">Yarıyıl tatiline ulaşıldı 🎉</div>`;
  }

  const tl = document.getElementById('timeline');
  const upcoming = sched.filter(s=>s.date>=tISO);
  const list = expanded ? sched : upcoming.slice(0, Math.min(upcoming.length,8));
  tl.innerHTML = list.map(s=>{
    const cls = s.holiday ? 'holiday' : (s.date<tISO ? 'past' : (s.date===tISO?'today':''));
    if(s.holiday) return `<div class="row ${cls}"><span>${WD[s.wd]} ${s.date}</span><span>Tatil 🌴</span></div>`;
    return `<div class="row ${cls}"><span>${WD[s.wd]} ${s.date}</span><span class="badge">${s.driver}</span></div>`;
  }).join('');
  document.getElementById('toggleBtn').textContent = expanded ? 'Sadece yaklaşanları göster' : 'Tüm planı göster (geçmiş dahil)';

  document.getElementById('ovPerson').innerHTML = cfg.people.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('holChips').innerHTML = cfg.holidays.map(d=>
    `<span class="chip">${d}<button data-h="${d}">✕</button></span>`).join('');
  document.getElementById('ovChips').innerHTML = Object.entries(cfg.overrides).map(([d,p])=>
    `<span class="chip">${d} → ${p}<button data-o="${d}">✕</button></span>`).join('');
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>call('removeHoliday',{date:b.dataset.h}));
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>call('removeOverride',{date:b.dataset.o}));
}

document.getElementById('toggleBtn').addEventListener('click', ()=>{ expanded=!expanded; render(); });

async function load(){
  try{
    const res = await fetch(APPS_SCRIPT_URL+'?action=schedule');
    cfg = await res.json();
    if(cfg.error){ document.getElementById('subtitle').textContent = 'Hata: '+cfg.error; return; }
    render();
  }catch(err){
    document.getElementById('subtitle').textContent = 'Veri yüklenemedi. APPS_SCRIPT_URL doğru mu?';
  }
}

async function call(action, params){
  const st = document.getElementById('statusMsg');
  const pin = document.getElementById('pinInput').value;
  st.textContent = 'Gönderiliyor…';
  const qs = new URLSearchParams(Object.assign({action, pin}, params));
  try{
    const res = await fetch(APPS_SCRIPT_URL+'?'+qs.toString());
    const data = await res.json();
    if(data.error){ st.textContent = '❌ '+data.error; return; }
    cfg = data; render();
    st.textContent = '✅ Güncellendi.';
  }catch(e){ st.textContent = '❌ Bağlantı hatası.'; }
}

document.getElementById('holBtn').onclick=()=>{
  const v=document.getElementById('holDate').value;
  if(v) call('addHoliday',{date:v});
};
document.getElementById('ovBtn').onclick=()=>{
  const v=document.getElementById('ovDate').value, p=document.getElementById('ovPerson').value;
  if(v) call('setOverride',{date:v, person:p});
};

load();
</script>
</body>
</html>
